# perso_dense_val — gpt-4o MQ4CS_persq rewrite + raw qwen3 (MQ4CS_persq_qwen_instruct),
# and oracle_qwen_instruct as a reproduction check (should == 36.3 fp16).
# Full-ClueWeb fp16 FAISS, 4-GPU shard. Mirrors the run that produced 33.1/36.3.
#   cd src && CUDA_VISIBLE_DEVICES=0,1,2,3 PATH=/data/rech/huiyuche/envs/trec_ikat/bin:$PATH \
#   python -m apcir.evaluate.run_experiments_grouped \
#     --config ./apcir/evaluate/fuse_then_eval_config_perso_dense_val_mq4cs.yaml --merge topk
iterate:
  machine: ["octal31"]
  retrieval_model: ["qwen3"]
  retrieval_query_type: ["MQ4CS_persq_qwen_instruct", "oracle_qwen_instruct"]
  reranker: ["none"]
  topics: ["perso_dense_val"]

param_mapping:
  retrieval_model:
    qwen3:
      dense_query_encoder_path: "/data/rech/huiyuche/huggingface/models--Qwen--Qwen3-Embedding-0.6B/snapshots/c54f2e6e80b2d7b7de06f51cec4959f6b3e03418"
      dense_index_dir_path: "/part/01/Tmp/yuchenhui/indexes/clueweb22b_ikat23_qwen_merged"
      embed_dim: 1024
      passage_block_num: 6
      wandb_run_name: "perso_dense_val_mq4cs"
  topics:
    perso_dense_val:
      input_query_path: "../data/topics/perso_dense_val/perso_dense_val.json"
      qrel_file_path: "../data/qrels/perso_dense_val_qrel.txt"

fixed:
