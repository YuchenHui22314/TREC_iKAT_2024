# =============================================================================
# TREC CAsT 2020 ONLY, BM25 with the official automatic rewrite.
# CAsT-19 ships no automatic rewrite, hence 2020-only here.
#
# Collection: MS MARCO v1 passages + TREC CAR, as ONE merged Lucene index (38,429,835 docs).
# We use the Pyserini PREBUILT `cast2019` index (docids carry MARCO_/CAR_ prefixes, which is
# exactly what the CAsT qrels use), so nothing has to be indexed locally. 2019 and 2020 share
# this same collection.
#
# Topics were converted from the official CAsT files by
#   python -m apcir.preprocess.build_cast_topics
# into the pipeline's usual Turn JSON schema, so turn_id == the qrel qid ("{topic}_{turn}").
#
# Query types that make sense here:
#   raw     -> the context-dependent utterance (lower bound)
#   oracle  -> the human/manual rewrite (the standard CAsT comparison point)
# CAsT has NO user profile, so every ptkb/profile query type is inapplicable.
#
# Run:  cd src && PATH=/data/rech/huiyuche/envs/trec_ikat/bin:$PATH \
#       python -m apcir.evaluate.run_experiments \
#         --config ./apcir/evaluate/fuse_then_eval_config_cast.yaml
# =============================================================================

iterate:
  machine: ["octal31"]
  retrieval_model: ["BM25"]
  retrieval_query_type: ["cast_automatic_rewrite"]
  reranker: ["none"]
  topics: ["cast_20_test"]

param_mapping:
  retrieval_model:
    BM25:
      wandb_run_name: "bm25_cast"
  topics:
    cast_19_test:
      input_query_path: "../data/topics/cast19/cast_19_test.json"
      qrel_file_path: "../data/qrels/cast_19_qrel.txt"
    cast_20_test:
      input_query_path: "../data/topics/cast20/cast_20_test.json"
      qrel_file_path: "../data/qrels/cast_20_qrel.txt"

fixed:
  collection: "cast_marco_car"
  topics: "cast_19_test"
  input_query_path: "../data/topics/cast19/cast_19_test.json"
  # the prebuilt Pyserini cast2019 Lucene index (MS MARCO passages + TREC CAR)
  sparse_index_dir_path: "/data/rech/huiyuche/TREC_iKAT_2024/data/indexes/index-cast2019/"
  output_dir_path: "../results"
  qrel_file_path: "../data/qrels/cast_19_qrel.txt"
  seed: 42
  save_results_to_object: false
  save_ranking_list: true
  run_rag: true
  run_eval: true

  retrieval_model: "BM25"
  retrieval_top_k: 1000
  personalization_group: "all"
  query_gpu_id: 0
  query_encoder_batch_size: 200

  splade_query_encoder_path: "/data/rech/huiyuche/huggingface/models--naver--splade-v3/snapshots/8291b13eb8f4e24cc745c542825f14eb87296879"
  splade_index_dir_path: "/data/rech/huiyuche/TREC_iKAT_2024/data/indexes/index-cast2019/"

  use_pyserini_dense_search: false
  dense_query_encoder_path: "/data/rech/huiyuche/huggingface/models--castorini--ance-msmarco-passage/snapshots/6d7e7d6b6c59dd691671f280bc74edb4297f8234"
  dense_index_dir_path: "/data/rech/huiyuche/TREC_iKAT_2024/data/indexes/index-cast2019/"
  faiss_n_gpu: 1
  use_gpu_for_faiss: true
  embed_dim: 768
  tempmem: -1
  passage_block_num: 12

  bm25_k1: 0.9
  bm25_b: 0.4

  qe_type: "none"
  fb_terms: 20
  fb_docs: 10
  original_query_weight: 0.5

  fusion_type: 'none'
  QRs_to_rank: ["mistral_rar_rw", "mistral_rar_rwrs", "mistral_judge_and_rewrite_rw"]
  fuse_weights: [0.1, 0.4]
  fusion_normalization: "none"
  level_type: "gpt-3.5_judge_and_rewrite"
  per_query_weight_max_value: 1.2
  optimize_level_weights: "group"
  target_metrics: "mrr,ndcg@3,recall@10,recall@100"
  optimize_step: 0.01

  reranker: "none"
  rerank_top_k: 50
  cache_dir: "/data/rech/huiyuche/huggingface"
  rerank_batch_size: 67
  rerank_quant: "none"
  rankgpt_llm: "gpt-3.5-turbo"
  window_size: 4
  step: 1

  generation_model: "none"
  generation_prompt: "none"
  generation_top_k: 3

  save_to_wandb: false
  wandb_run_name: ""
  metrics: "map,ndcg,ndcg_cut.1,ndcg_cut.3,ndcg_cut.5,ndcg_cut.10,P.1,P.3,P.5,P.10,P.20,recall.5,recall.10,recall.20,recall.50,recall.100,recall.1000,recip_rank"
  metrics_to_print: ["recip_rank", "ndcg_cut_3", "recall_10", "recall_100"]
  given_ranking_list_path: "none"

  run_name: "none"
  retrieval_query_type: "oracle"
  reranking_query_type: "none"
  generation_query_type: "none"
  generate_ikat_submission: false
