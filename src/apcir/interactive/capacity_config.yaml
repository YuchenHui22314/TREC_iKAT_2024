# Loadable capacity units for the RALI Searcher.
#
# NOTE: index paths are MACHINE-SPECIFIC. This file is for **octal31** (251G RAM), whose only
# /part/01 index dir is /part/01/Tmp/yuchenhui/indexes/ — it holds the ClueWeb qwen index plus the
# QReCC dev/test indexes. The full ClueWeb ance/splade/bm25 indexes live on **octal40** under
# /part/01/Tmp/yuchen/ ; deploy there with a sibling capacity_config.octal40.yaml.
#
# resident_ram_gb = steady-state RAM once loaded; load_peak_ram_gb = transient peak DURING load
# (dense = read fp32 block + cast to fp16, block by block, so peak = resident + one fp32 block +
# its fp16 cast). vram_gb = steady-state VRAM (rerankers only; dense fp16 search VRAM is transient).
indexes:
  # --- ClueWeb22-B production corpus. Only qwen is present on octal31, and its fp16 LOAD PEAK
  #     (~320G) exceeds octal31's ~237G free RAM, so the guard REFUSES it here (needs octal40). ---
  clueweb_qwen:
    kind: dense
    resident_ram_gb: 235.0
    load_peak_ram_gb: 320.0
    vram_gb: 0.0
    index_dir: /part/01/Tmp/yuchenhui/indexes/clueweb22b_ikat23_qwen_merged
    dtype: float16

  # --- QReCC dev/test indexes (present on octal31, fit in RAM — exercise the real load/unload +
  #     capacity machinery without needing octal40). ---
  qrecc_ance:           # 55 blocks, 768-d, ~55M passages
    kind: dense
    resident_ram_gb: 80.0
    load_peak_ram_gb: 85.0
    vram_gb: 0.0
    index_dir: /part/01/Tmp/yuchenhui/indexes/qrecc_ance_merged
    dtype: float16
  qrecc_qwen:           # 55 blocks, 1024-d
    kind: dense
    resident_ram_gb: 107.0
    load_peak_ram_gb: 112.0
    vram_gb: 0.0
    index_dir: /part/01/Tmp/yuchenhui/indexes/qrecc_qwen_emb_0.6_merged
    dtype: float16
  qrecc_ance_mini:      # 1 block, 1000 vecs — fast smoke test
    kind: dense
    resident_ram_gb: 0.01
    load_peak_ram_gb: 0.02
    vram_gb: 0.0
    index_dir: /part/01/Tmp/yuchenhui/indexes/qrecc_ance_mini_merged
    dtype: float16

  reranker_qwen3:       # GPU-resident, co-hosted on the gen-LLM GPU (bf16 ~9G VRAM)
    kind: reranker
    resident_ram_gb: 1.0
    load_peak_ram_gb: 1.0
    vram_gb: 9.0
    index_dir: null
    dtype: bf16
