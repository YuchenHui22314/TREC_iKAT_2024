    index_dir: /part/01/Tmp/yuchenhui/indexes/qrecc_ance_mini_merged
    dtype: float16
    embed_dim: 768
    block_num: 1
    corpus: qrecc
    query_encoder: /data/rech/huiyuche/huggingface/models--castorini--ance-msmarco-passage/snapshots/6d7e7d6b6c59dd691671f280bc74edb4297f8234
  qrecc_bm25:           # small QReCC lucene index -> BM25 + doc-fetch (passage text)
    kind: sparse
    resident_ram_gb: 0.5
    load_peak_ram_gb: 0.5
    vram_gb: 0.0
    index_dir: /part/01/Tmp/yuchenhui/indexes/qrecc_hf_sparse_mini_index
    dtype: null
    corpus: qrecc

  # =================== TopiOCQA ===================
  topiocqa_ance:        # ANCE 768-d, ~26 blocks
